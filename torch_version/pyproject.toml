[project]
name = "lrq-solver"
version = "0.1.0"
description = "Torch implementation of LRQ-Solver for large-scale 3D PDE experiments."
requires-python = ">=3.10,<3.13"
dependencies = [
    "hydra-core>=1.3.2",
    "numpy>=1.24",
    "omegaconf>=2.3.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "tensorboardX>=2.6",
    "torch==2.6.0+cu124",
    "tqdm>=4.66",
]

[project.optional-dependencies]
vis = [
    "meshio>=5.3",
    "pymeshlab>=2023.12",
    "vtk>=9.2",
]
web = [
    "pyvista>=0.43",
    "streamlit>=1.30",
    "stpyvista>=0.1",
    "xvfbwrapper>=0.2",
]
dev = [
    "pre-commit>=3.5",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
